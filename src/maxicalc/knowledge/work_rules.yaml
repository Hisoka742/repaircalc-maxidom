# Rule layer of the work-type matcher: product (category path + name) -> work types with a ROLE.
# role: m = material, t = tool, c = consumable / supporting material (see docs/TAXONOMY.md).
# A product receives the UNION of all rules it matches. `cat` is a regex over the lower-case
# category path joined with " > " (ё -> е); `name` (optional) a regex over the lower-case name;
# `not_name` excludes. Products with no matching rule get no work type (out of repair scope).
# The rules are the teacher of the learned model (weak labels) and a fallback; the human gold set
# overrides both. Keep rules specific: a vague rule is worse than none.
rules:
  # ------------------------------------------------------------------ paints, primers, coatings
  - {id: paint-wall, cat: "краски для стен и потолков",
     works: {wall_painting: m, ceiling_painting: m}}
  - {id: paint-facade, cat: "краски фасадные", works: {wall_painting: m}}
  - {id: paint-floor, cat: "краски для пола", works: {wood_metal_coating: m}}
  - {id: paint-misc, cat: "краски и эмали > (краски для мебели|краски масляные|краски по металлу|краски специальные|краски термостойкие|эмали универсальные|краски аэрозольные)",
     works: {wood_metal_coating: m}}
  - {id: varnish, cat: "краска и малярный инструмент > лаки", works: {wood_metal_coating: m}}
  - {id: wood-protect, cat: "средства защитные для дерева > (антисептики защитно|масла|морилки)",
