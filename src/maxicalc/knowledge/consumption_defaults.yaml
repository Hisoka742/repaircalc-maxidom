# Consumption defaults used when a product card gives no consumption (resolution order in the
# engine: card fact -> LLM-inferred >= threshold -> brand+type default -> type default; the
# explain line says which). Every value is a manufacturer figure with URL and the quoted text.
# Choice inside a quoted range: paint = LOWER end of the "theoretical coverage" range (more
# paint, practical coverage is lower than theoretical); putty / plaster / primer = UPPER end of
# consumption (more material). Pages read 2026-10-15.
#
# attr: spread_m2_per_l (m2 per litre per coat) | consumption_kg_per_m2_per_mm |
#       consumption_l_per_m2 (per coat)
# type match: first type whose `calc` equals the product calc and whose `any` regex (name +
# category, lower-case) matches; `not` excludes. `brands` are upper-case card brand names.
types:
  wall_paint_ceiling:
    calc: paint
    any: "потолк"
    not: "аэрозол|эмаль|по металл|для металл|пальчиков|маркер|обув|авто"
    attr: spread_m2_per_l
    value: 7
    range: [7, 11]
    source: "Tikkurila Nova 2 (краска для потолков), Product Data Sheet"
    url: "https://kz-production-tk-tikkurila.cms.tikkurila.com/sites/default/files/pim/documents/Nova_2_EN_PDS_Tikkurila.pdf"
    quote: "Theoretical coverage 7-11m2/l"
    brands: {TIKKURILA: 7}
  wall_paint_interior:
    calc: paint
    any: "акрил|водно|водоэмульс|латекс|в/д|для стен|интерьер|матов|моющ"
    not: "аэрозол|эмаль|по металл|для металл|пальчиков|маркер|обув|авто|фасад|для пола|радиатор|дерев"
    attr: spread_m2_per_l
    value: 8
    range: [8, 12]
    source: "Tikkurila Harmony (интерьерная матовая краска), Product Data Sheet 06.11.2024"
    url: "https://tikkurila.com/sites/default/files/harmony-en-pds-tikkurila_7.pdf"
    quote: "Theoretical coverage 8-12 m²/l. Recommended dry film thickness: 36-46 um."
    brands: {TIKKURILA: 8}
  plaster_gypsum:
    calc: putty
    any: 'штукатур|ротбанд(?!\s*финиш)|волма.слой'
    not: "декоратив|фасад"
    attr: consumption_kg_per_m2_per_mm
    value: 0.9
    range: [0.85, 0.9]
    source: "ВОЛМА-Слой (гипсовая штукатурка), страница продукта volma.ru"
    url: "https://www.volma.ru/production/catalog/plaster/volma-sloy/"
    quote: "расход сухой смеси при толщине 10 мм 8–9 кг на 1 м²"
    brands: {VOLMA: 0.9, KNAUF: 0.85}
    brand_sources:
      KNAUF:
        source: "КНАУФ-Ротбанд, лист расхода (сноска «*» не извлечена, основа не подтверждена)"
        url: "https://knauf.by/upload/iblock/dac/Knauf_IL_Rotband_07_06_19_preview_v4.pdf"
        quote: "КНАУФ-Ротбанд кг 8,5*; средняя толщина слоя 10 мм"
  putty_gypsum_finish:
    calc: putty
    any: "гипс|фуген|финиш|ротбанд"
    not: "штукатур|полимер|цемент|готов|паста|по дереву|автомоб|стекловолокн"
    attr: consumption_kg_per_m2_per_mm
    value: 1.0
    range: [0.8, 1.0]
    source: "КНАУФ-Фуген, страница продукта Knauf (при сплошном шпаклевании слоем 1 мм)"
    url: "https://knauf.com/ru-UZ/p/produkt/knauf-fugen-20804_0604"
    quote: "при сплошном шпаклевании слоем 1 мм: 0,8 – 1,0 кг/м2"
    note: "прямая загрузка страницы вернула 403; цитата получена из поискового индекса"
    brands: {KNAUF: 1.0, VOLMA: 1.0}
    brand_sources:
      VOLMA:
        source: "ВОЛМА-Финиш, страница продукта volma.ru"
        url: "https://www.volma.ru/production/catalog/putty/volma-finish-finish-plaster/"
        quote: "расход около 0,9–1,0 кг сухой смеси на 1 м² при слое 1 мм"
  putty_polymer_cement_finish:
    calc: putty
    any: "полимер|цемент|vetonit|ветонит|lr|vh"
    not: "готов|паста|по дереву|автомоб|стекловолокн"
    attr: consumption_kg_per_m2_per_mm
    value: 1.2
    range: [1.2, 1.2]
    source: "Vetonit LR+ / Vetonit VH, страницы продуктов и техкарты vetonit.com"
    url: "https://vetonit.com/sukhie-shpaklevki/vetonit-lr"
    quote: "расход смеси 1,2 кг/м² на 1 мм (LR+); 1,2 кг/м²/мм (VH, vetonit.com/products/shtukaturki-shpaklevki/vetonit-vh)"
    brands: {VETONIT: 1.2, ВЕТОНИТ: 1.2}
  putty_ready_paste:
    calc: putty
    any: "готов|паста"
    not: "по дереву|эпокс|автомоб|стекловолокн|отвердител"
    attr: consumption_kg_per_m2_per_mm
    value: 1.6
    range: [1.6, 1.6]
    source: "КНАУФ-МП Паста (готовая шпаклёвка), расход при сплошном шпаклевании слоем 0,3 мм"
    url: "https://knauf.by/upload/iblock/683/Knauf_IL_MP_PASTA_1.PDF"
    quote: "толщине слоя 0,3 мм ... КНАУФ-МП Паста кг/кв.м 0,48"
    note: "0,48 кг/м² на 0,3 мм пересчитано линейно в 1,6 кг/м²/мм; один источник"
    brands: {KNAUF: 1.6}
  primer_acrylic:
    calc: primer
    any: "."
    not: "аэрозол|по металл|антисепт"
    attr: consumption_l_per_m2
    value: 0.2
    range: [0.1, 0.2]
    source: "Ceresit CT 17 PROFI, техническое описание"
    url: "https://datasheets.tdx.henkel.com/CERESIT-CT-17-ru_KZ.pdf"
    quote: "Расход CT 17 PROFI: 0,1 – 0,2 л/м² при однократном нанесении"
    brands: {CERESIT: 0.2}
  self_leveling_cement:
    calc: self_leveling
    any: "."
    not: "эпокс|полиуретан"
    attr: consumption_kg_per_m2_per_mm
    value: 1.8
    range: [1.8, 1.8]
    source: "Ceresit CN 68, техническое описание (единственный источник: типовое значение)"
    url: "https://datasheets.tdx.henkel.com/CERESIT-CN-68-ru_BY.pdf"
    quote: "Расход сухой смеси около 1,8 кг / м2 / мм"
    brands: {CERESIT: 1.8}
