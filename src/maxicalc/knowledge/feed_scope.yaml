# Which parts of the Maxidom feed's category tree matter for repair (used for statistics and for
# sampling the gold set; matching itself runs on the whole catalog). Top-level category names as
# they appear in the feed. `exclude` lists second-level categories removed from an included root.
repair_roots:
  - Краска и малярный инструмент
  - Строительные материалы
  - Напольные покрытия
  - Плитка
  - Двери, окна, лестницы
  - Сантехника
  - Электротовары
  - Освещение
  - Электроинструмент
  - Ручной инструмент
  - Строительное оборудование
  - Скобяные изделия
exclude:
  Строительные материалы: [Двери для шкафов, "Полки, щиты, фасады мебельные", "Печи, камины", Забор]
  Электротовары: [Батаpейки, Звонки, Умный дом, Стабилизаторы напряжения]
  Освещение: [Фонарики, Торшеры, Настольные лампы, "Подсветка для растений и фитолампы"]
  Скобяные изделия: [Сейфы, Система хранения Джокер, Стеллажи, Мебельная фурнитура, Такелаж,
                     Кованые элементы, "Аптечки, ящики, шкафы", Информационные таблички и указатели]
  Сантехника: [Мебель для ванных комнат, Фильтры для воды, Водонагреватели]
# second-level categories included from otherwise excluded roots
repair_subcategories:
  Интерьер: ["Обои, пленка самоклеящаяся", "Панели настенные и комплектующие"]
