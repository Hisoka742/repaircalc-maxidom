# Golden cases. `source` says how the expected value was obtained:
#   hand-derived: computed by hand from the formula named in the engine docstring (NOT yet
#                 cross-checked against a manufacturer calculator -- verified: false).
#   Replace/extend with manufacturer sheet / organiser reference values; set verified: true
#   and put the URL in `source_url`.
# kind: pack = integer purchasable units (must match exactly); continuous = tolerance allowed.
cases:
  - id: wp-001
    calc: wallpaper_rolls
    kind: pack
    inputs: {length: 4, width: 3, height: 2.5, roll_width: 1.06, roll_length: 10.05,
             openings: [{kind: door, w: 0.9, h: 2.05, wall: 0}]}
    expected: 5   # strip 2.6 -> 3/roll; strips 3+3+4+3=13 -> ceil(13/3)
    source: hand-derived
    verified: false
  - id: wp-002
    calc: wallpaper_rolls
    kind: pack
    inputs: {length: 4, width: 3, height: 2.5, roll_width: 0.53, roll_length: 10.05, rapport: 0.64}
    expected: 10  # strip 3.2 -> 3/roll; strips 28 -> 10
    source: hand-derived
    verified: false
  - id: wp-003
    calc: wallpaper_rolls
    kind: pack
    inputs: {length: 4, width: 3, height: 2.5, roll_width: 0.53, roll_length: 10.05,
             rapport: 0.64, reserve: 1}
    expected: 11
    source: hand-derived
    verified: false
  - id: paint-001
    calc: paint_liters
    kind: continuous
    inputs: {area: 30, spread: 10, layers: 2}
    expected: 6
    source: hand-derived
    verified: false
  - id: paint-002
    calc: paint_liters
    kind: continuous
    inputs: {area: 30, spread: 10, layers: 2, porous: true}
    expected: 6.6
    source: hand-derived
    verified: false
  - id: putty-001
